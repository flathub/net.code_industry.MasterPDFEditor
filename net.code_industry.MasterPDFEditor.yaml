app-id: net.code_industry.MasterPDFEditor
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: masterpdfeditor5wrapper
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=cups
modules:
  - name: sane-backends
    sources:
      - type: git
        url: https://gitlab.com/sane-project/backends.git
        tag: 1.4.0
        commit: c7e4b5e35e3d614d2b1181d760a717bfc395a203
    post-install:
      - echo 127.0.0.1 > /app/etc/sane.d/net.conf
      - echo net > /app/etc/sane.d/dll.conf

  - name: libpkcs11-helper
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/OpenSC/pkcs11-helper/releases/download/pkcs11-helper-1.31.0/pkcs11-helper-1.31.0.tar.bz2
        sha256: 46f0067bccd7be2c28f88b8bca775172b9e52fb6fc1280b44ca8bb831433fef9

  - name: masterpdfeditor5
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - ln -s /app/{extra,bin}/masterpdfeditor5
      - install -Dm 755 apply_extra.sh /app/bin/apply_extra
      - install -Dm 644 net.code_industry.MasterPDFEditor.metainfo.xml -t /app/share/metainfo
      - install -Dm 644 net.code_industry.MasterPDFEditor.desktop -t /app/share/applications
      - install -Dm 644 net.code_industry.MasterPDFEditor.png -t /app/share/icons/hicolor/128x128/apps
      - install masterpdfeditor5wrapper.sh /app/bin/masterpdfeditor5wrapper
    sources:
      - type: extra-data
        url: https://code-industry.net/public/master-pdf-editor-5.9.98-qt6.x86_64.tar.gz
        filename: master-pdf-editor.tar.gz
        sha256: 3f88eec51519ded8e5adedd003c5d257a10c466b09889474587d5a96c7248c96
        only-arches: [x86_64]
        size: 21526274
        x-checker-data:
          type: html
          url: https://code-industry.net/free-pdf-editor/
          version-pattern: master-pdf-editor-([0-9.]+)-qt6\.x86_64\.tar\.gz
          url-template: https://code-industry.net/public/master-pdf-editor-$version-qt6.x86_64.tar.gz
      # aarch64: Code Industry ships no Qt6 arm64 build yet, and a manifest has a single
      # runtime-version, so this Qt6 bump (#113) is x86_64-only. The previous Qt5 arm64
      # source is kept below for reference. NOTE: it is NOT a drop-in uncomment — a Qt5
      # binary won't run on the Qt6 (6.9) runtime; when a Qt6 arm64 tarball exists, swap
      # the url/sha256/size/x-checker pattern to it before re-enabling.
      # - type: extra-data
      #   url: https://code-industry.net/public/master-pdf-editor-5.9.98-qt5.arm64.tar.gz
      #   filename: master-pdf-editor.tar.gz
      #   sha256: fa33573b87db6e487d51e6b437ed1f25b1d132ef734bf77ba3c5b80f6fbb90c2
      #   only-arches: [aarch64]
      #   size: 19863299
      #   x-checker-data:
      #     type: html
      #     url: https://code-industry.net/free-pdf-editor/
      #     version-pattern: master-pdf-editor-([0-9.]+)-qt5\.arm64\.tar\.gz
      #     url-template: https://code-industry.net/public/master-pdf-editor-$version-qt5.arm64.tar.gz
      - type: script
        dest-filename: apply_extra.sh
        commands:
          - tar --strip-components=1 -xf master-pdf-editor.tar.gz
          - rm master-pdf-editor.tar.gz
      - type: file
        path: net.code_industry.MasterPDFEditor.metainfo.xml
      - type: file
        path: net.code_industry.MasterPDFEditor.desktop
      - type: file
        path: net.code_industry.MasterPDFEditor.png
      - type: script
        dest-filename: masterpdfeditor5wrapper.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/${FLATPAK_ID:-net.code_industry.MasterPDFEditor}"
          - export QT_QPA_PLATFORM="wayland;xcb"
          - /app/bin/masterpdfeditor5 "$@"
